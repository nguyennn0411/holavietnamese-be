spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: holavietnamese-be-test
  mail:
    host: localhost
  datasource:
    url: jdbc:mysql://127.0.0.1:${MYSQL_PORT:3307}/hola_vietnamese_test?connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:hola}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
    baseline-on-migrate: false
    clean-disabled: true

server:
  port: 0

jwt:
  secretKey: holaVietnameseTestSecretKey2026holaVietnameseTestSecretKey2026
  expiration: 86400000
  refresh-duration: 604800000

google:
  client-id: ""

app:
  mail:
    enabled: false
  notification:
    test-endpoint-enabled: true
    cleanup-cron: "-"
  destination:
    seed:
      enabled: false
