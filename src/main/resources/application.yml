spring:
  config:
    import: "optional:file:./.env[.properties],optional:file:./.env.mysql[.properties]"

  application:
    name: holavietnamese-be

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:${MYSQL_PORT:3307}/${MYSQL_DATABASE:hola_vietnamese}?connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:${MYSQL_USER:hola}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

    encoding:
      charset: UTF-8
      enabled: true
      force: true

server:
  port: ${PORT:8080}

  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

jwt:
  secretKey: ${JWT_SECRET_KEY:holaVietnameseSecretKey2025holaVietnameseSecretKey2025}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-duration: ${JWT_REFRESH_DURATION:604800000}

google:
  client-id: ${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  mail:
    enabled: ${MAIL_ENABLED:false}

logging:
  level:
    com.sep490.backend: INFO
    org.springframework.security: INFO
