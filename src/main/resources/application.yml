spring:
  config:
    import: "optional:file:./.env[.properties],optional:file:./.env.mysql[.properties],optional:file:./.env.cloudinary[.properties]"

  application:
    name: holavietnamese-be

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:${MYSQL_PORT:3307}/${MYSQL_DATABASE:hola_vietnamese}?connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:${MYSQL_USER:hola}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

    encoding:
      charset: UTF-8
      enabled: true
      force: true

server:
  port: ${PORT:${BACKEND_PORT:8080}}

  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

jwt:
  secretKey: ${JWT_SECRET_KEY:local-development-only-change-this-hola-vietnamese-signing-key}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-duration: ${JWT_REFRESH_DURATION:604800000}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  avatar-folder: ${CLOUDINARY_AVATAR_FOLDER:hola-vietnamese/avatars}
  audio-folder: ${CLOUDINARY_AUDIO_FOLDER:hola-vietnamese/audio}
  course-cover-folder: ${CLOUDINARY_COURSE_COVER_FOLDER:hola-vietnamese/courses/covers}
  lesson-image-folder: ${CLOUDINARY_LESSON_IMAGE_FOLDER:hola-vietnamese/lessons/images}
  lesson-video-folder: ${CLOUDINARY_LESSON_VIDEO_FOLDER:hola-vietnamese/lessons/videos}
  question-image-folder: ${CLOUDINARY_QUESTION_IMAGE_FOLDER:hola-vietnamese/questions/images}
  question-audio-folder: ${CLOUDINARY_QUESTION_AUDIO_FOLDER:hola-vietnamese/questions/audio}

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  mail:
    enabled: ${MAIL_ENABLED:false}
  ai:
    gemini-api-key: ${GEMINI_API_KEY:${GOOGLE_AI_API_KEY:}}
    openai-api-key: ${OPENAI_API_KEY:}
    openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    default-model: ${AI_DEFAULT_MODEL:gemini-3.8-flash}

logging:
  level:
    com.sep490.backend: INFO
    org.springframework.security: INFO
