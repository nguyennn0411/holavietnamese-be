spring:
  config:
    import: "optional:file:./.env.mysql[.properties]"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: sep490-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:${MYSQL_PORT:3307}/${MYSQL_DATABASE:hola_vietnamese}?connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:${MYSQL_USER:hola}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
