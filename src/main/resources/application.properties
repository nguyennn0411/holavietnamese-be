spring.application.name=holavietnamese-be
server.port=${PORT:8080}

# Database Configuration (MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:${MYSQL_PORT:3307}/${MYSQL_DATABASE:hola_vietnamese}?createDatabaseIfNotExist=true&connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${MYSQL_USER:hola}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${MYSQL_PASSWORD:}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway Configuration - Disabled
spring.flyway.enabled=false

# JPA/Hibernate - Auto create/update schema automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secretKey=${JWT_SECRET_KEY:holaVietnameseSecretKey2025holaVietnameseSecretKey2025}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-duration=${JWT_REFRESH_DURATION:604800000}

# Google OAuth Configuration
google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}

# Encoding
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

# Logging
logging.level.com.sep490.backend=INFO
logging.level.org.springframework.security=INFO
