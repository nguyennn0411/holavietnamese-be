spring.application.name=holavietnamese-be
server.port=${PORT:8080}

# Database Configuration (MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/holavietnamese?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secretKey=${JWT_SECRET_KEY:holaVietnameseSecretKey2025holaVietnameseSecretKey2025}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-duration=${JWT_REFRESH_DURATION:604800000}

# Redis (optional - for token blacklist, tạm thời chưa dùng)
# spring.data.redis.host=${REDIS_HOST:localhost}
# spring.data.redis.port=${REDIS_PORT:6379}

# Encoding
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

# Logging
logging.level.com.sep490.backend=INFO
logging.level.org.springframework.security=INFO
